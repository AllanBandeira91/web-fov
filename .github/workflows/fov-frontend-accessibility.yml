name: FOV Frontend Accessibility

on:
  push:
  pull_request:
    branches:
      - dev
      - master

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: be-a11y Accessibility Checker
        id: a11y
        continue-on-error: true
        uses: be-lenka/be-a11y@v2.2.9
        with:
          url: https://fovapp.live
          report: a11y-report.json

      - name: Parse and Use the outputs
        run: |
          echo "Extraction des résultats du rapport..."
          TOTAL_ISSUES=$(jq '. | length' a11y-report.json 2>/dev/null || echo "0")
          echo "total=$TOTAL_ISSUES"
          echo "report=a11y-report.json"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: a11y-report.json
