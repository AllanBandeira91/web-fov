name: FOV Frontend Accessibility

on:
  push:
  pull_request:
    branches:
      - dev
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  accessibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        page:
          - { name: "home", url: "https://fovapp.live" }
          - { name: "login", url: "https://fovapp.live/login" }
          - { name: "followed", url: "https://fovapp.live/followed" }
          - { name: "discover", url: "https://fovapp.live/discover" }
          - { name: "how-does-it-work", url: "https://fovapp.live/how-does-it-work" }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: be-a11y Accessibility Checker
        id: a11y
        continue-on-error: true
        uses: be-lenka/be-a11y@v2.2.9
        with:
          url: ${{ matrix.page.url }}
          report: a11y-report-${{ matrix.page.name }}.json

      - name: Parse and Print GitHub Notices
        run: |
          REPORT_FILE="a11y-report-${{ matrix.page.name }}.json"
          echo "Extraction et classification des alertes pour [${{ matrix.page.name }}]..."

          if [ -f "$REPORT_FILE" ]; then
            jq -c '.[]' "$REPORT_FILE" | while read -r item; do
              type=$(echo "$item" | jq -r '.type')
              message=$(echo "$item" | jq -r '.message')
              line=$(echo "$item" | jq -r '.line')

              if [[ "$type" == "aria-role-invalid" || "$type" == "missing-landmark" ]]; then
                LEVEL="error"   # S'affichera en ROUGE vif sur GitHub
              else
                LEVEL="warning" # S'affichera en JAUNE pour les alertes mineures
              fi

              echo "::$LEVEL line=$line,title=Accessibility (${{ matrix.page.name }} - $type)::$message"
            done
          else
            echo "Aucun rapport généré pour ${{ matrix.page.name }}."
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report-${{ matrix.page.name }}
          path: a11y-report-${{ matrix.page.name }}.json
