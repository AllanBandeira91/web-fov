name: FOV Frontend Accessibility

on:
  push:
  pull_request:
    branches:
      - dev
      - master

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: be-a11y Accessibility Checker
        id: a11y
        continue-on-error: true
        uses: be-lenka/be-a11y@v2.2.9
        with:
          url: https://fovapp.live
          report: a11y-report.json

      - name: Parse and Print GitHub Notices
        run: |
          echo "Extraction et création des notices GitHub..."
          if [ -f a11y-report.json ]; then
            jq -c '.[]' a11y-report.json | while read -r item; do
              type=$(echo "$item" | jq -r '.type')
              message=$(echo "$item" | jq -r '.message')
              line=$(echo "$item" | jq -r '.line')
              echo "::warning line=$line,title=Accessibility ($type)::$message"
            done
          else
            echo "Aucun rapport généré."
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: a11y-report.json
