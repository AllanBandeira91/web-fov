name: FOV Frontend Accessibility


on:
   push:
     branches:
       - main
       - 99-utiliser-une-github-action-pour-vérifier-des-critères-daccessibilité-du-frontend

jobs:
  accessibility_scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: github/accessibility-scanner@v3
        with:
          repository: Flexible-Output-View/web-fov
          token: ${{ secrets.GH_TOKEN }}
          cache_key: cached_results-fovapp.json
          skip_copilot_assignment: true
          include_screenshots: true
          file_best_practice_issues: false
          file_experimental_issues: false
          dry_run: true
          open_grouped_issues: true
          group_by: rule
          url_configs: '[{"url":"https://fovapp.live","waitForSelectors":["app-root .app-layout"]},{"url":"https://fovapp.live/login","waitForSelectors":["app-root"]},{"url":"https://fovapp.live/followed","waitForSelectors":["app-root .app-layout"]},{"url":"https://fovapp.live/discover","waitForSelectors":["app-root .app-layout"]},{"url":"https://fovapp.live/how-does-it-work","waitForSelectors":["app-root .app-layout"]}]'